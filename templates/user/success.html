<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Booking Successful</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    font-family:'Poppins',sans-serif;
    background:#eaf5f3;

    display:flex;
    justify-content:center;
    align-items:center;

    height:100vh;
}

.success-box{

    width:420px;

    background:white;

    padding:40px;

    border-radius:25px;

    text-align:center;

    box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.success-icon{

    font-size:70px;

    margin-bottom:20px;
}

.success-box h1{

    color:#1f6f6d;

    margin-bottom:15px;
}

.success-box p{

    color:#666;

    line-height:1.6;
}

.success-btn{

    margin-top:30px;

    display:inline-block;

    padding:14px 28px;

    background:#1f6f6d;

    color:white;

    text-decoration:none;

    border-radius:12px;

    transition:0.3s;
}

.success-btn:hover{

    background:#175654;
}

</style>

</head>

<body>

<div class="success-box">

    <div class="success-icon">
        ✅
    </div>

    <h1>Appointment Confirmed</h1>

    <p>

        Your booking has been successfully saved.
        Thank you for choosing SalonEase.

    </p>

    <a href="/dashboard"
       class="success-btn">

       Back to Dashboard

    </a>

</div>

</body>

</html>
