<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - SalonEase</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background-color: #e6f2f1;
}

/* Navbar */
.navbar {
    display: flex;
    justify-content: space-between;
    padding: 15px 60px;
    background: white;
}

.logo {
    font-size: 22px;
    font-weight: 600;
}

.nav-links a {
    margin: 0 10px;
    text-decoration: none;
    color: #2c2c2c;
}

.btn-signup {
    background: #1f6f6d;
    color: white;
    padding: 6px 15px;
    border-radius: 15px;
}

/* Login Container */
.container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: calc(100vh - 70px);
}

/* Card */
.login-box {
    background: white;
    padding: 30px;   /* reduced */
    width: 320px;    /* slightly smaller */
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.08);
    text-align: center;
}

/* Heading */
.login-box h2 {
    margin-bottom: 20px;
}

/* Inputs */
.input-group {
    text-align: left;
    margin-bottom: 12px;
}

.input-group label {
    font-size: 14px;
}

.input-group input {
    width: 100%;
    padding: 9px;
    margin-top: 5px;
    border: 1px solid #ddd;
    border-radius: 6px;
    box-sizing: border-box;
}

/* Button */
.btn-login {
    width: 100%;
    padding: 10px;
    border: none;
    background: #1f6f6d;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
    margin-top: 10px;
}

.btn-login:hover {
    background: #175a58;
    transform: scale(1.03);
}

/* Links */
.extra {
    margin-top: 12px;
    font-size: 14px;
}

.extra a {
    color: #1f6f6d;
    text-decoration: none;
}

.extra a:hover {
    text-decoration: underline;
}

/* Page fade-in */
body {
    animation: pageFade 0.6s ease;
}

@keyframes pageFade {
    from { opacity: 0; }
    to { opacity: 1; }
}

/* Form animation */
.login-box {
    animation: slideUp 0.7s ease;
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(40px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Input animation (stagger effect) */
.input-group {
    opacity: 0;
    transform: translateY(15px);
    animation: inputFade 0.5s ease forwards;
}

.input-group:nth-child(1) {
    animation-delay: 0.2s;
}
.input-group:nth-child(2) {
    animation-delay: 0.4s;
}

@keyframes inputFade {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Button animation */
.btn-login {
    transition: all 0.3s ease;
}

.btn-login:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(0,0,0,0.15);
}
</style>
</head>

<body>

<!-- Navbar -->
<div class="navbar">
    <div class="logo">✂ SalonEase</div>

    <div class="nav-links">
        <a href="{{ url_for('home') }}">Home</a>
        <a href="/services">Services</a>
        <a href="{{ url_for('login') }}">Login</a>
        <a href="{{ url_for('register') }}" class="btn-signup">Sign Up</a>
    </div>
</div>

<!-- Login Form -->
<div class="container">
    <div class="login-box">

        <h2>Welcome Back</h2>

        <form method="POST" action="{{ url_for('login') }}">

            <div class="input-group">
                <label>Email</label>
                <input type="email" name="email" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>

            <button type="submit" class="btn-login">Login</button>

        </form>

        <div class="extra">
            Don’t have an account? 
            <a href="{{ url_for('register') }}">Sign Up</a>
        </div>

    </div>
</div>

</body>
</html>
