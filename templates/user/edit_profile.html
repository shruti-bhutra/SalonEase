<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Edit Profile</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    background:#e6f2f1;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.edit-box{
    width:100%;
    max-width:420px;
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

h2{
    text-align:center;
    margin-bottom:25px;
    color:#1f6f6d;
}

.input-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:8px;
    font-size:14px;
}

input, select{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #ddd;
    outline:none;
}

button{
    width:100%;
    padding:13px;
    border:none;
    background:#1f6f6d;
    color:white;
    border-radius:12px;
    font-size:15px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#175452;
}

</style>
</head>

<body>

<div class="edit-box">

    <h2>Edit Profile</h2>

    <form method="POST">

        <div class="input-group">
            <label>Name</label>
            <input type="text" name="name" value="{{ username }}" required>
        </div>

        <div class="input-group">
            <label>Email</label>
            <input type="email" name="email" value="{{ email }}" required>
        </div>

        <div class="input-group">
            <label>Gender</label>

            <select name="gender">

                <option value="male"
                {% if gender == 'male' %}selected{% endif %}>
                Male
                </option>

                <option value="female"
                {% if gender == 'female' %}selected{% endif %}>
                Female
                </option>

            </select>

        </div>

        <button type="submit">
            Save Changes
        </button>

    </form>

</div>

</body>
</html>
